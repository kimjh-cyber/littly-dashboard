<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>litt.ly KPI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#f5f5f7;--bg2:#ffffff;--bg3:#ebebed;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--text:#111113;--text2:#6e6e80;--text3:#aaaab8;--blue:#1a6ef5;--purple:#7c5ce8;--green:#0b9e63;--amber:#d4890a;--red:#e03e3e;--blue-dim:rgba(26,110,245,0.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;min-height:100vh;}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:14px;}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text2);}
.loading-sub{font-size:11px;color:var(--text3);}
.error-box{background:#fff0f0;border:1px solid #ffc0c0;border-radius:10px;padding:20px 24px;max-width:420px;text-align:center;}
.error-box h3{color:var(--red);margin-bottom:8px;}
.error-box p{font-size:13px;color:var(--text2);line-height:1.7;}
.header{padding:28px 32px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.brand{font-size:18px;font-weight:700;}.brand span{color:var(--blue);}
.subtitle{font-size:12px;color:var(--text3);margin-left:10px;}
.last-updated{font-size:11px;color:var(--text3);background:var(--bg3);padding:4px 10px;border-radius:20px;border:0.5px solid var(--border);}
.view-switch{padding:16px 32px 0;display:flex;gap:4px;}
.vsb{font-size:13px;font-weight:500;padding:7px 20px;border-radius:8px;border:0.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;}
.vsb:hover{color:var(--text);border-color:var(--border2);}
.vsb.active{background:var(--text);color:var(--bg2);border-color:var(--text);}
.filter-bar{padding:14px 32px 0;}
.filter-section{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.filter-row:last-child{margin-bottom:0;}
.filter-label{font-size:11px;color:var(--text3);min-width:56px;font-weight:500;}
.fq{font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;}
.fq:hover{color:var(--text);border-color:var(--border2);}
.fq.active{background:var(--blue-dim);color:var(--blue);border-color:rgba(26,110,245,0.3);}
.range-select{font-size:12px;padding:5px 10px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;outline:none;}
.range-select:focus{border-color:var(--blue);}
.apply-btn{font-size:11px;padding:5px 14px;border-radius:6px;border:0.5px solid rgba(26,110,245,0.4);background:var(--blue-dim);color:var(--blue);cursor:pointer;font-weight:500;}
.filter-divider{width:0.5px;height:14px;background:var(--border2);margin:0 2px;}
.main{padding:16px 32px 40px;}
.sec{display:none;}.sec.show{display:block;}
.period-label{font-size:12px;color:var(--text3);margin-bottom:14px;}
.period-label strong{color:var(--text2);font-weight:500;}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:20px;}
.kc{background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;}
.kl{font-size:11px;color:var(--text3);margin-bottom:5px;}
.kv{font-size:19px;font-weight:600;color:var(--text);letter-spacing:-0.5px;line-height:1;}
.ks{font-size:11px;margin-top:4px;}
.up{color:var(--green);}.dn{color:var(--red);}.fl{color:var(--text3);}
.tb{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.t{font-size:12px;padding:5px 11px;border-radius:6px;border:0.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.t:hover{color:var(--text);border-color:var(--border2);}
.t.active{background:var(--blue-dim);color:var(--blue);border-color:rgba(26,110,245,0.3);}
.t.detail.active{background:rgba(124,92,232,0.08);color:#7c5ce8;border-color:rgba(124,92,232,0.3);}
.t.detail{color:var(--text2);}
.t.detail:hover{color:#7c5ce8;border-color:rgba(124,92,232,0.2);}
.tsep{width:0.5px;height:18px;background:var(--border);margin:0 3px;}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;}
.ct{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:9px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text2);margin-bottom:8px;}
.ld{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:middle;}
.note{font-size:10px;color:var(--text3);margin-top:5px;margin-bottom:10px;}
.mrr-hero{background:linear-gradient(135deg,rgba(26,110,245,0.06),rgba(124,92,232,0.06));border:0.5px solid rgba(26,110,245,0.2);border-radius:12px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.mrr-value{font-size:34px;font-weight:700;letter-spacing:-1.5px;background:linear-gradient(90deg,#1a6ef5,#7c5ce8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.mrr-label{font-size:11px;color:var(--text3);margin-bottom:3px;}
.mrr-sub{font-size:12px;color:var(--green);margin-top:3px;}
.mrr-meta{display:flex;gap:16px;flex-wrap:wrap;}
.mrr-item-label{font-size:10px;color:var(--text3);margin-bottom:2px;}
.mrr-item-value{font-size:13px;font-weight:600;color:var(--text);}
.portion-wrap{margin-bottom:10px;}
.portion-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 18px;}
.portion-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:12px;}
.portion-item{margin-bottom:10px;}
.p-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.p-label{font-size:12px;color:var(--text);display:flex;align-items:center;gap:5px;}
.p-vals{font-size:11px;color:var(--text2);display:flex;gap:8px;}
.p-bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.p-bar-row{}
.p-bar-hd{display:flex;justify-content:space-between;margin-bottom:3px;}
.p-bar-label{font-size:10px;color:var(--text3);}
.p-bar-pct{font-size:12px;font-weight:600;}
.p-bar-bg{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.p-bar{height:100%;border-radius:3px;transition:width 0.4s;}
@media(max-width:600px){.header,.view-switch,.filter-bar,.main{padding-left:16px;padding-right:16px;}.r2{grid-template-columns:1fr;}.mrr-hero{flex-direction:column;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">데이터 불러오는 중...</div>
  <div class="loading-sub" id="loading-sub">구글 시트 연결 중</div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div style="display:flex;align-items:baseline">
      <div class="brand">litt.ly <span>KPI</span></div>
      <div class="subtitle">결제 · 매출 · 성장 대시보드</div>
    </div>
    <div class="last-updated" id="last-updated">로딩 중...</div>
  </div>

  <div class="view-switch">
    <button class="vsb active" onclick="switchV('w',this)">주간 뷰</button>
    <button class="vsb" onclick="switchV('m',this)">월간 뷰</button>
    <button class="vsb" onclick="switchV('mrr',this)">MRR</button>
  </div>

  <div class="filter-bar">
    <div class="filter-section">
      <div class="filter-row">
        <span class="filter-label">빠른 선택</span>
        <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
          <button class="fq" onclick="applyQuick('w','all',this)">전체</button>
          <button class="fq" onclick="applyQuick('w',4,this)">최근 4주</button>

          <button class="fq" onclick="applyQuick('w',13,this)">최근 13주</button>
          <div class="filter-divider"></div>
          <button class="fq" onclick="applyQuick('m',3,this)">최근 3개월</button>
          <button class="fq" onclick="applyQuick('m',6,this)">최근 6개월</button>
          <button class="fq" onclick="applyQuick('m',12,this)">최근 12개월</button>
          <button class="fq" onclick="applyQuick('m','all',this)">전체 기간</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">기간 범위</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <select class="range-select" id="rs-w"></select>
          <select class="range-select" id="rs-m" style="display:none"></select>
          <span style="font-size:12px;color:var(--text3)">~</span>
          <select class="range-select" id="re-w"></select>
          <select class="range-select" id="re-m" style="display:none"></select>
          <button class="apply-btn" onclick="applyRange()">적용</button>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div id="sw" class="sec show">
      <div class="period-label" id="w-period"></div>
      <div id="w-summary-card" style="display:none;background:linear-gradient(135deg,rgba(26,110,245,0.04),rgba(124,92,232,0.04));border:0.5px solid rgba(26,110,245,0.15);border-radius:12px;padding:14px 18px;margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;font-weight:600;color:var(--blue)">AI 요약</span>
            <span style="font-size:10px;color:var(--text3);background:var(--bg3);padding:2px 7px;border-radius:10px">Claude</span>
          </div>
          <button onclick="genSummary('w')" id="w-summary-btn" style="font-size:11px;padding:4px 12px;border-radius:6px;border:0.5px solid rgba(26,110,245,0.3);background:var(--blue-dim);color:var(--blue);cursor:pointer">새로 생성</button>
        </div>
        <div id="w-summary-text" style="font-size:13px;color:var(--text);line-height:1.7"></div>
      </div>
      <div class="kg" id="w-kpi"></div>
      <div class="tb" id="w-tabs">
        <button class="t active" onclick="showW('signup',this)">요약</button>
        <div class="tsep"></div>
        <button class="t detail" onclick="showW('newrenew',this)">신규 / 갱신</button>
        <button class="t detail" onclick="showW('paytype',this)">월결제 / 연결제</button>
        <button class="t detail" onclick="showW('plan',this)">프로 / 브랜드</button>
        <div class="tsep"></div>
        <button class="t detail" onclick="showW('cancel',this)">취소</button>
      </div>
      <div id="w-single" class="card"><div class="ct" id="wt"></div><div id="wl" class="leg"></div><div style="position:relative;height:230px"><canvas id="wC"></canvas></div></div>
      <div id="w-overview" style="display:none">
        <div class="r2">
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--blue)"><div class="ct">전체 전환 추이</div><div style="position:relative;height:180px"><canvas id="wOv1"></canvas></div></div>
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--green)"><div class="ct">전체 매출 추이</div><div style="position:relative;height:180px"><canvas id="wOv2"></canvas></div></div>
        </div>
      </div>
      <div id="w-double" style="display:none">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--blue)"><div class="ct" id="wd-sum-t1"></div><div style="position:relative;height:130px"><canvas id="wSum1"></canvas></div></div>
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--green)"><div class="ct" id="wd-sum-t2"></div><div style="position:relative;height:130px"><canvas id="wSum2"></canvas></div></div>
        </div>
        <div class="r2">
          <div class="card" style="margin-bottom:0"><div class="ct" id="wd-t1"></div><div id="wd-l1" class="leg"></div><div style="position:relative;height:200px"><canvas id="wD1"></canvas></div></div>
          <div class="card" style="margin-bottom:0"><div class="ct" id="wd-t2"></div><div id="wd-l2" class="leg"></div><div style="position:relative;height:200px"><canvas id="wD2"></canvas></div></div>
        </div>
        <div class="note" id="w-note"></div>
      </div>
      <div class="portion-wrap" id="w-portion" style="display:none"><div class="portion-card"><div class="portion-title" id="w-pt"></div><div id="w-pg"></div></div></div>
    </div>

    <div id="sm" class="sec">
      <div class="period-label" id="m-period"></div>
      <div id="m-summary-card" style="display:none;background:linear-gradient(135deg,rgba(26,110,245,0.04),rgba(124,92,232,0.04));border:0.5px solid rgba(26,110,245,0.15);border-radius:12px;padding:14px 18px;margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;font-weight:600;color:var(--blue)">AI 요약</span>
            <span style="font-size:10px;color:var(--text3);background:var(--bg3);padding:2px 7px;border-radius:10px">Claude</span>
          </div>
          <button onclick="genSummary('m')" id="m-summary-btn" style="font-size:11px;padding:4px 12px;border-radius:6px;border:0.5px solid rgba(26,110,245,0.3);background:var(--blue-dim);color:var(--blue);cursor:pointer">새로 생성</button>
        </div>
        <div id="m-summary-text" style="font-size:13px;color:var(--text);line-height:1.7"></div>
      </div>
      <div class="kg" id="m-kpi"></div>
      <div class="tb" id="m-tabs">
        <button class="t active" onclick="showM('signup',this)">요약</button>
        <div class="tsep"></div>
        <button class="t detail" onclick="showM('newrenew',this)">신규 / 갱신</button>
        <button class="t detail" onclick="showM('paytype',this)">월결제 / 연결제</button>
        <button class="t detail" onclick="showM('plan',this)">프로 / 브랜드</button>
        <div class="tsep"></div>
        <button class="t detail" onclick="showM('cancel',this)">취소</button>
      </div>
      <div id="m-single" class="card"><div class="ct" id="mt"></div><div id="ml" class="leg"></div><div style="position:relative;height:230px"><canvas id="mC"></canvas></div></div>
      <div id="m-overview" style="display:none">
        <div class="r2">
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--blue)"><div class="ct">전체 전환 추이</div><div style="position:relative;height:180px"><canvas id="mOv1"></canvas></div></div>
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--green)"><div class="ct">전체 매출 추이</div><div style="position:relative;height:180px"><canvas id="mOv2"></canvas></div></div>
        </div>
      </div>
      <div id="m-double" style="display:none">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--blue)"><div class="ct" id="md-sum-t1"></div><div style="position:relative;height:130px"><canvas id="mSum1"></canvas></div></div>
          <div class="card" style="margin-bottom:0;border-top:2px solid var(--green)"><div class="ct" id="md-sum-t2"></div><div style="position:relative;height:130px"><canvas id="mSum2"></canvas></div></div>
        </div>
        <div class="r2">
          <div class="card" style="margin-bottom:0"><div class="ct" id="md-t1"></div><div id="md-l1" class="leg"></div><div style="position:relative;height:200px"><canvas id="mD1"></canvas></div></div>
          <div class="card" style="margin-bottom:0"><div class="ct" id="md-t2"></div><div id="md-l2" class="leg"></div><div style="position:relative;height:200px"><canvas id="mD2"></canvas></div></div>
        </div>
        <div class="note" id="m-note"></div>
      </div>
      <div class="portion-wrap" id="m-portion" style="display:none"><div class="portion-card"><div class="portion-title" id="m-pt"></div><div id="m-pg"></div></div></div>
    </div>

    <div id="smrr" class="sec">
      <div class="period-label">MRR &nbsp;·&nbsp; <strong>활성 구독 기반 월환산 매출</strong></div>
      <div class="mrr-hero" id="mrr-hero"></div>
      <div class="tb" id="mrr-tabs">
        <button class="t active" onclick="showMRR('total',this)">전체 MRR</button>
        <button class="t" onclick="showMRR('plan',this)">프로 / 브랜드</button>
        <button class="t" onclick="showMRR('paytype',this)">월결제 / 연결제</button>
        <button class="t" onclick="showMRR('active',this)">활성 구독수</button>
        <button class="t" onclick="showMRR('arpu',this)">ARPU</button>
      </div>
      <div class="card"><div class="ct" id="mrr-t"></div><div id="mrr-l" class="leg"></div><div style="position:relative;height:250px"><canvas id="mrrC"></canvas></div></div>
      <div style="font-size:10px;color:var(--text3)">* 종료일 기준 활성 구독 스냅샷 · 월결제 = 금액 그대로, 연결제 = 연간금액 ÷ 12</div>
    </div>
  </div>
</div>

<script>
// ━━━ Apps Script URL (여기만 수정하면 됩니다) ━━━
const API = 'https://script.google.com/macros/s/AKfycbzNehb6BbrWOuXPXPbwvaW3ZVqRTbXPn9bWxasQmLOWKEBUGpcSbGMbVdkwNR1nNvsI/exec';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function parseCSV(text){
  const rows=text.trim().split('\n');
  const hdrs=rows[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return rows.slice(1).filter(r=>r.trim()).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(const c of line){if(c==='"')inQ=!inQ;else if(c===','&&!inQ){vals.push(cur.trim());cur='';}else cur+=c;}
    vals.push(cur.trim());
    const o={};hdrs.forEach((h,i)=>o[h]=(vals[i]||'').replace(/^"|"$/g,''));return o;
  });
}

const C1='#1a6ef5',C2='#7c5ce8',C3='#0b9e63',C4='#d4890a',C5='#e03e3e';
const GR='rgba(0,0,0,0.05)',TR='rgba(0,0,0,0.35)';
function fmtM(v){return Math.round(v/10000).toLocaleString()+'만';}
function leg(c,l){return`<span style="display:flex;align-items:center"><span class="ld" style="background:${c}"></span>${l}</span>`;}
function kpi(l,v,s){return`<div class="kc"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`;}
function wow(a,b){if(!b)return'<span class="fl">—</span>';const p=(a-b)/b*100;return`<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`;}
function opts(yF){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:GR},ticks:{color:TR,font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:13}},y:{beginAtZero:false,grid:{color:GR},ticks:{color:TR,font:{size:10},callback:yF}}}};}
function mkL(l,d,c,dash){return{label:l,data:d,borderColor:c,backgroundColor:'transparent',tension:0.35,pointRadius:2,pointHoverRadius:5,borderWidth:2,borderDash:dash||[]};}
function mkF(l,d,c){return{label:l,data:d,borderColor:c,backgroundColor:c+'22',fill:true,tension:0.35,pointRadius:2,pointHoverRadius:5,borderWidth:2};}

let WK={},MO={},MRR={};
let wR={s:0,e:0},mR={s:0,e:0};
let ch={wC:null,wOv1:null,wOv2:null,wSum1:null,wSum2:null,wD1:null,wD2:null,mC:null,mOv1:null,mOv2:null,mSum1:null,mSum2:null,mD1:null,mD2:null,mrrC:null};

function isoWeek(d){const dt=new Date(d);dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+4-(dt.getDay()||7));const y=new Date(dt.getFullYear(),0,1);return Math.ceil(((dt-y)/86400000+1)/7);}
function getWk(d){return`${d.getFullYear()}_${isoWeek(d)}`;}
function getMo(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function empty(){return{total:0,rev:0,new_c:0,new_r:0,ren_c:0,ren_r:0,pm_c:0,pm_r:0,py_c:0,py_r:0,bm_c:0,bm_r:0,by_c:0,by_r:0,cancel_c:0,cancel_r:0,signup:0,new_pm_c:0,new_pm_r:0,new_bm_c:0,new_bm_r:0,ren_pm_c:0,ren_pm_r:0,ren_bm_c:0,ren_bm_r:0};}

function process(upgrades,payments,members){
  const toD=s=>s?new Date(s.replace(' ','T')):null;
  const upgMap={};upgrades.forEach(u=>upgMap[u.id]=u);

  const joined=payments.map(p=>{
    const u=upgMap[p.upgradeId]||{};
    return{memberId:p.memberId||u.memberId,플랜:u.플랜||'',결제방식:u.결제방식||'',종료일:u.종료일||'',
      금액:parseInt(p.금액)||0,취소일:p.취소일||'',취소금액:parseInt(p.취소금액)||0,
      환불수수료:parseInt(p.환불수수료)||0,생성일:toD(p.생성일)};
  }).filter(p=>p.생성일&&p.금액>0);

  joined.sort((a,b)=>a.생성일-b.생성일);
  const firstSeen={};
  joined.forEach(p=>{const wk=getWk(p.생성일);if(!firstSeen[p.memberId])firstSeen[p.memberId]=wk;p.is_new=firstSeen[p.memberId]===wk;});

  const cancelRows=joined.filter(p=>p.취소일).map(p=>({...p,cancelDate:toD(p.취소일)}));
  const memberRows=members.map(m=>({date:toD(m.가입일||m['가입일'])})).filter(m=>m.date);

  // 주간
  const wkD={};
  function addTo(map,key,cb){if(!map[key])map[key]=empty();cb(map[key]);}
  joined.forEach(p=>{
    addTo(wkD,getWk(p.생성일),s=>{
      s.total++;s.rev+=p.금액;
      const pl=p.플랜,py=p.결제방식;
      const isPro=pl==='pro',isBiz=pl==='business';
      if(p.is_new){
        s.new_c++;s.new_r+=p.금액;
        if(isPro){s.new_pm_c++;s.new_pm_r+=p.금액;}
        else if(isBiz){s.new_bm_c++;s.new_bm_r+=p.금액;}
      }else{
        s.ren_c++;s.ren_r+=p.금액;
        if(isPro){s.ren_pm_c++;s.ren_pm_r+=p.금액;}
        else if(isBiz){s.ren_bm_c++;s.ren_bm_r+=p.금액;}
      }
      if(pl==='pro'&&py==='month'){s.pm_c++;s.pm_r+=p.금액;}
      else if(pl==='pro'&&py==='year'){s.py_c++;s.py_r+=p.금액;}
      else if(pl==='business'&&py==='month'){s.bm_c++;s.bm_r+=p.금액;}
      else if(pl==='business'&&py==='year'){s.by_c++;s.by_r+=p.금액;}
    });
  });
  cancelRows.forEach(p=>{addTo(wkD,getWk(p.cancelDate),s=>{s.cancel_c++;s.cancel_r+=(p.취소금액-p.환불수수료);});});
  memberRows.forEach(m=>{addTo(wkD,getWk(m.date),s=>{s.signup++;});});

  const sortWks=Object.keys(wkD).sort((a,b)=>{const[ay,aw]=a.split('_').map(Number),[by,bw]=b.split('_').map(Number);return ay!==by?ay-by:aw-bw;});
  WK.lb=sortWks.map(wk=>{const[y,w]=wk.split('_');return y==='2026'?w+'주':y.slice(2)+'-'+w+'주';});
  WK._wks=sortWks;
  const flds=['total','rev','new_c','new_r','ren_c','ren_r','pm_c','pm_r','py_c','py_r','bm_c','bm_r','by_c','by_r','cancel_c','cancel_r','signup'];
  flds.forEach(f=>{WK[f]=sortWks.map(wk=>wkD[wk][f]||0);});
  WK.mon_c=WK.pm_c.map((_,i)=>WK.pm_c[i]+WK.bm_c[i]);WK.yr_c=WK.py_c.map((_,i)=>WK.py_c[i]+WK.by_c[i]);
  WK.pro_c=WK.pm_c.map((_,i)=>WK.pm_c[i]+WK.py_c[i]);WK.biz_c=WK.bm_c.map((_,i)=>WK.bm_c[i]+WK.by_c[i]);
  WK.mon_r=WK.pm_r.map((_,i)=>WK.pm_r[i]+WK.bm_r[i]);WK.yr_r=WK.py_r.map((_,i)=>WK.py_r[i]+WK.by_r[i]);
  WK.pro_r=WK.pm_r.map((_,i)=>WK.pm_r[i]+WK.py_r[i]);WK.biz_r=WK.bm_r.map((_,i)=>WK.bm_r[i]+WK.by_r[i]);
  WK.net_r=WK.rev.map((_,i)=>WK.rev[i]-WK.cancel_r[i]);
  // 신규/갱신 × 플랜 교차 데이터 - 주간
  WK.new_pro_c=WK._wks.map(wk=>wkD[wk].new_pm_c||0);WK.new_biz_c=WK._wks.map(wk=>wkD[wk].new_bm_c||0);
  WK.ren_pro_c=WK._wks.map(wk=>wkD[wk].ren_pm_c||0);WK.ren_biz_c=WK._wks.map(wk=>wkD[wk].ren_bm_c||0);
  WK.new_pro_r=WK._wks.map(wk=>wkD[wk].new_pm_r||0);WK.new_biz_r=WK._wks.map(wk=>wkD[wk].new_bm_r||0);
  WK.ren_pro_r=WK._wks.map(wk=>wkD[wk].ren_pm_r||0);WK.ren_biz_r=WK._wks.map(wk=>wkD[wk].ren_bm_r||0);

  // 월간
  const moD={};
  joined.forEach(p=>{
    addTo(moD,getMo(p.생성일),s=>{
      s.total++;s.rev+=p.금액;
      const pl=p.플랜,py=p.결제방식;
      const isPro=pl==='pro',isBiz=pl==='business';
      if(p.is_new){
        s.new_c++;s.new_r+=p.금액;
        if(isPro){s.new_pm_c++;s.new_pm_r+=p.금액;}
        else if(isBiz){s.new_bm_c++;s.new_bm_r+=p.금액;}
      }else{
        s.ren_c++;s.ren_r+=p.금액;
        if(isPro){s.ren_pm_c++;s.ren_pm_r+=p.금액;}
        else if(isBiz){s.ren_bm_c++;s.ren_bm_r+=p.금액;}
      }
      if(pl==='pro'&&py==='month'){s.pm_c++;s.pm_r+=p.금액;}
      else if(pl==='pro'&&py==='year'){s.py_c++;s.py_r+=p.금액;}
      else if(pl==='business'&&py==='month'){s.bm_c++;s.bm_r+=p.금액;}
      else if(pl==='business'&&py==='year'){s.by_c++;s.by_r+=p.금액;}
    });
  });
  cancelRows.forEach(p=>{addTo(moD,getMo(p.cancelDate),s=>{s.cancel_c++;s.cancel_r+=(p.취소금액-p.환불수수료);});});
  memberRows.forEach(m=>{addTo(moD,getMo(m.date),s=>{s.signup++;});});
  const sortMos=Object.keys(moD).sort();
  MO.lb=sortMos.map(mo=>{const[y,m]=mo.split('-');return y.slice(2)+'-'+m;});
  MO._mos=sortMos;
  flds.forEach(f=>{MO[f]=sortMos.map(mo=>moD[mo][f]||0);});
  MO.mon_c=MO.pm_c.map((_,i)=>MO.pm_c[i]+MO.bm_c[i]);MO.yr_c=MO.py_c.map((_,i)=>MO.py_c[i]+MO.by_c[i]);
  MO.pro_c=MO.pm_c.map((_,i)=>MO.pm_c[i]+MO.py_c[i]);MO.biz_c=MO.bm_c.map((_,i)=>MO.bm_c[i]+MO.by_c[i]);
  MO.mon_r=MO.pm_r.map((_,i)=>MO.pm_r[i]+MO.bm_r[i]);MO.yr_r=MO.py_r.map((_,i)=>MO.py_r[i]+MO.by_r[i]);
  MO.pro_r=MO.pm_r.map((_,i)=>MO.pm_r[i]+MO.py_r[i]);MO.biz_r=MO.bm_r.map((_,i)=>MO.bm_r[i]+MO.by_r[i]);
  MO.net_r=MO.rev.map((_,i)=>MO.rev[i]-MO.cancel_r[i]);
  // 신규/갱신 × 플랜 교차 - 월간
  MO.new_pro_c=MO._mos.map(mo=>moD[mo].new_pm_c||0);MO.new_biz_c=MO._mos.map(mo=>moD[mo].new_bm_c||0);
  MO.ren_pro_c=MO._mos.map(mo=>moD[mo].ren_pm_c||0);MO.ren_biz_c=MO._mos.map(mo=>moD[mo].ren_bm_c||0);
  MO.new_pro_r=MO._mos.map(mo=>moD[mo].new_pm_r||0);MO.new_biz_r=MO._mos.map(mo=>moD[mo].new_bm_r||0);
  MO.ren_pro_r=MO._mos.map(mo=>moD[mo].ren_pm_r||0);MO.ren_biz_r=MO._mos.map(mo=>moD[mo].ren_bm_r||0);

  // MRR
  const now=new Date();
  const mrrMos=[];let cur=new Date(2023,4,1);
  while(cur<=now){mrrMos.push(new Date(cur));cur.setMonth(cur.getMonth()+1);}
  MRR.lb=mrrMos.map(d=>String(d.getFullYear()).slice(2)+'-'+String(d.getMonth()+1).padStart(2,'0'));
  MRR.total=[];MRR.pro=[];MRR.biz=[];MRR.month_r=[];MRR.year_r=[];MRR.active=[];
  const toD2=s=>s?new Date(s):null;
  mrrMos.forEach(ms=>{
    const me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
    let tot=0,pro=0,biz=0,mo=0,yr=0,act=0;
    joined.forEach(p=>{
      if(p.생성일>me)return;
      if(p.취소일&&toD(p.취소일)<=me)return;
      if(p.종료일){const ed=new Date(p.종료일);if(!isNaN(ed)&&ed<=me)return;}
      const pay=p.결제방식,amt=p.금액;
      const mrr=pay==='year'?amt/12:pay==='month'?amt:0;
      if(!mrr)return;
      act++;tot+=mrr;
      if(p.플랜==='pro')pro+=mrr;else biz+=mrr;
      if(pay==='month')mo+=mrr;else yr+=mrr;
    });
    MRR.total.push(Math.round(tot));MRR.pro.push(Math.round(pro));MRR.biz.push(Math.round(biz));
    MRR.month_r.push(Math.round(mo));MRR.year_r.push(Math.round(yr));MRR.active.push(act);
  });
  MRR.arpu=MRR.total.map((v,i)=>MRR.active[i]>0?Math.round(v/MRR.active[i]):0);
}

function renderAll(){
  // 주간: 2026년 1주부터 마지막 주까지
  const wStart = WK.lb.findIndex(l => l === '1주' || l.includes('26-1주'));
  const wS = wStart >= 0 ? wStart : 0;
  wR = {s: wS, e: WK.lb.length-1};

  // 월간: 26-01부터 마지막 월까지
  const mStart = MO.lb.findIndex(l => l === '26-01');
  const mS = mStart >= 0 ? mStart : 0;
  mR = {s: mS, e: MO.lb.length-1};

  initSelects();renderWKpi();renderMKpi();renderMRRHero();
  showW('signup',document.querySelector('#w-tabs .t'));updateSelects('w');
}

  const rs=document.getElementById('rs-w'),re=document.getElementById('re-w');
  const ms=document.getElementById('rs-m'),me=document.getElementById('re-m');
  rs.innerHTML=re.innerHTML=ms.innerHTML=me.innerHTML='';

  // 주간 셀렉트 - 2026_1주 기본 선택
  const wDefS = WK.lb.findIndex(l => l==='1주' || l.includes('26-1주'));
  WK.lb.forEach((l,i)=>{
    rs.innerHTML+=`<option value="${i}"${i===Math.max(0,wDefS)?' selected':''}>${l}</option>`;
    re.innerHTML+=`<option value="${i}"${i===WK.lb.length-1?' selected':''}>${l}</option>`;
  });

  // 월간 셀렉트 - 26-01 기본 선택
  const mDefS = MO.lb.findIndex(l => l==='26-01');
  MO.lb.forEach((l,i)=>{
    ms.innerHTML+=`<option value="${i}"${i===Math.max(0,mDefS)?' selected':''}>${l}</option>`;
    me.innerHTML+=`<option value="${i}"${i===MO.lb.length-1?' selected':''}>${l}</option>`;
  });
}

function kill(...ids){ids.forEach(id=>{if(ch[id]){ch[id].destroy();ch[id]=null;}});}
function mk(id,lb,ds,yF,stacked){
  const isStacked=!!stacked;
  const type=isStacked?'bar':'line';
  const extraOpts=isStacked?{scales:{x:{stacked:true,grid:{color:GR},ticks:{color:TR,font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:13}},y:{stacked:true,beginAtZero:true,grid:{color:GR},ticks:{color:TR,font:{size:10},callback:yF}}}}:opts(yF);
  ch[id]=new Chart(document.getElementById(id),{type,data:{labels:lb,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},...extraOpts}});
}
function slW(a){return a.slice(wR.s,wR.e+1);}
function slM(a){return a.slice(mR.s,mR.e+1);}
function sDs(ds,fn){return ds.map(d=>({...d,data:fn(d.data),borderRadius:d.backgroundColor?3:0}));}

function heatColor(val, max, hex){
  if(!max||max===0) return 'transparent';
  const pct = val/max;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${(pct*0.25+0.03).toFixed(2)})`;
}

function makeTable(lb, label, rows, colDefs, totC, totR, mode){
  const isCnt = mode==='cnt';
  const tot = isCnt ? totC : totR;
  const color1 = isCnt ? '#378ADD' : '#0b9e63';
  const color2 = isCnt ? '#0b9e63' : '#7F77DD';
  const dataRows = rows.slice(0,-1);
  const totalRow = rows[rows.length-1];
  const maxVals = dataRows.map(r=>Math.max(r[1],r[2]));
  const globalMax = Math.max(...maxVals, 1);
  const fmt = isCnt ? v=>v.toLocaleString()+'건' : v=>fmtM(v)+'원';

  // 합계 행의 컬럼 비율 (열 합계 기준)
  const col1tot = totalRow[1], col2tot = totalRow[2], colTot = totalRow[3];
  const col1pct = colTot>0?(col1tot/colTot*100):0;
  const col2pct = colTot>0?(col2tot/colTot*100):0;

  return `<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:10px;padding:14px 16px">
    <div style="font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:10px;padding-bottom:8px;border-bottom:0.5px solid var(--color-border-tertiary)">${isCnt?'결제 건수':'매출'}</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead>
        <tr>
          <th style="text-align:left;padding:4px 6px;color:var(--color-text-tertiary);font-weight:400;font-size:10px"></th>
          <th style="padding:4px 6px;font-size:11px;text-align:right;color:${color1};font-weight:600">
            ${colDefs[0]}
            <div style="font-size:12px;color:${color1};font-weight:700">${col1pct.toFixed(1)}%</div>
          </th>
          <th style="padding:4px 6px;font-size:11px;text-align:right;color:${color2};font-weight:600">
            ${colDefs[1]}
            <div style="font-size:12px;color:${color2};font-weight:700">${col2pct.toFixed(1)}%</div>
          </th>
          <th style="padding:4px 6px;color:var(--color-text-tertiary);font-weight:400;font-size:10px;text-align:right;border-bottom:1.5px solid var(--color-border-secondary)">합계</th>
        </tr>
        <tr><td colspan="4" style="border-bottom:1.5px solid var(--color-border-secondary);padding:0"></td></tr>
      </thead>
      <tbody>
        ${dataRows.map((row,ri)=>{
          const v1=row[1], v2=row[2], vt=row[3];
          const pct1=tot>0?(v1/tot*100):0, pct2=tot>0?(v2/tot*100):0;
          const rowPct=colTot>0?(vt/colTot*100):0;
          const bg1=heatColor(v1,globalMax,color1);
          const bg2=heatColor(v2,globalMax,color2);
          return `<tr>
            <td style="padding:9px 6px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);font-size:12px">
              <div style="font-weight:500">${row[0]}</div>
              <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px">${rowPct.toFixed(1)}%</div>
            </td>
            <td style="padding:9px 6px;border-bottom:0.5px solid var(--color-border-tertiary);text-align:right;background:${bg1};border-radius:4px">
              <div style="font-size:13px;color:var(--color-text-primary);font-weight:500">${fmt(v1)}</div>
              <div style="font-size:10px;color:${color1};font-weight:500">${pct1.toFixed(1)}%</div>
            </td>
            <td style="padding:9px 6px;border-bottom:0.5px solid var(--color-border-tertiary);text-align:right;background:${bg2};border-radius:4px">
              <div style="font-size:13px;color:var(--color-text-primary);font-weight:500">${fmt(v2)}</div>
              <div style="font-size:10px;color:${color2};font-weight:500">${pct2.toFixed(1)}%</div>
            </td>
            <td style="padding:9px 6px;border-bottom:0.5px solid var(--color-border-tertiary);text-align:right;color:var(--color-text-tertiary);font-size:12px">${fmt(vt)}</td>
          </tr>`;
        }).join('')}
        <tr style="border-top:1.5px solid var(--color-border-secondary)">
          <td style="padding:9px 6px;color:var(--color-text-primary);font-weight:600;font-size:12px">합계</td>
          <td style="padding:9px 6px;text-align:right;color:var(--color-text-primary);font-weight:600;font-size:13px">${fmt(col1tot)}</td>
          <td style="padding:9px 6px;text-align:right;color:var(--color-text-primary);font-weight:600;font-size:13px">${fmt(col2tot)}</td>
          <td style="padding:9px 6px;text-align:right;color:var(--color-text-secondary);font-weight:600;font-size:13px">${fmt(colTot)}</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

      revRows:[['Pro',src.pm_r[idx],src.py_r[idx],src.pro_r[idx]],['Brand',src.bm_r[idx],src.by_r[idx],src.biz_r[idx]],['합계',src.mon_r[idx],src.yr_r[idx],totR]],
    },
  };

  if(k==='cancel'){
    document.getElementById(tid).textContent='';

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        ${[{label:'취소',c:src.cancel_c[idx],r:src.cancel_r[idx],color:'#e03e3e'},{label:'유효',c:src.total[idx]-src.cancel_c[idx],r:src.rev[idx]-src.cancel_r[idx],color:'#0b9e63'}].map(item=>`
          <div style="background:rgba(${item.color==='#e03e3e'?'224,62,62':'11,158,99'},0.05);border:0.5px solid rgba(${item.color==='#e03e3e'?'224,62,62':'11,158,99'},0.2);border-radius:8px;padding:12px 14px">
            <div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px">${item.label}</div>
            <div style="font-size:18px;font-weight:600;color:${item.color}">${item.c.toLocaleString()}건</div>
            <div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">${fmtM(item.r)}원</div>
            <div style="font-size:11px;color:${item.color};margin-top:4px">${totC>0?(item.c/totC*100).toFixed(1):'0'}%</div>

  }

  const cfg=configs[k]; if(!cfg)return;
  document.getElementById(tid).textContent='';
  document.getElementById(gid).innerHTML=`
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:12px">${lb} 기준 · ${cfg.label} 교차 분석</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

      ${makeTable(lb,cfg.label,cfg.revRows,cfg.cols,totC,totR,'rev')}
    </div>`;
}

async function loadData(){
  const sub=document.getElementById('loading-sub');
  try{
    sub.textContent='시트 데이터 불러오는 중...';
    const fetchJ = sheet => fetch(`${API}?sheet=${sheet}`).then(r=>{if(!r.ok)throw new Error(sheet+' 읽기 실패');return r.json();});
    const [upgrades,payments,members] = await Promise.all([fetchJ('upgrades'),fetchJ('payments'),fetchJ('members')]);
    sub.textContent='데이터 집계 중...';
    process(upgrades,payments,members);
    const now=new Date();
    document.getElementById('last-updated').textContent=`Last updated · ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  }catch(e){
    document.getElementById('loading').innerHTML=`<div class="error-box"><h3>⚠️ 데이터 로드 실패</h3><p>${e.message}<br><br>구글 시트 → 공유 → "링크가 있는 모든 사용자 → 뷰어" 로 설정되어 있는지 확인해주세요.</p></div>`;
  }
}

// ── Claude API 요약 (Apps Script 경유) ──
async function genSummary(view) {
  const isW = view === 'w';
  const textEl = document.getElementById(`${view}-summary-text`);
  const btnEl  = document.getElementById(`${view}-summary-btn`);

  textEl.innerHTML = '<span style="color:var(--text3)">✦ 분석 중...</span>';
  if(btnEl) btnEl.disabled = true;

  const i   = isW ? wR.e : mR.e;
  const p   = i > 0 ? i - 1 : 0;
  const src = isW ? WK : MO;
  const lb  = isW ? WK.lb[i] : MO.lb[i];
  const unit = isW ? '주차' : '';

  const pct = (a,b) => b>0 ? ((a-b)/b*100).toFixed(1) : '0';
  const fmt = v => Math.round(v/10000).toLocaleString()+'만원';

  const prompt = `당신은 SaaS 스타트업의 데이터 분석가입니다. 아래 KPI 데이터를 보고 경영진을 위한 핵심 인사이트를 3~4문장으로 요약해주세요.

기간: ${lb}${unit} (비교: 전${isW?'주':'월'})
- 신규 회원가입: ${src.signup[i].toLocaleString()}명 (${pct(src.signup[i],src.signup[p])}% 변화)
- 전체 전환: ${src.total[i]}건 (${pct(src.total[i],src.total[p])}% 변화)
- 총 매출: ${fmt(src.rev[i])} (${pct(src.rev[i],src.rev[p])}% 변화)
- 순 매출: ${fmt(src.net_r[i])} (${pct(src.net_r[i],src.net_r[p])}% 변화)
- 신규 결제: ${src.new_c[i]}건 (${pct(src.new_c[i],src.new_c[p])}% 변화)
- 갱신 결제: ${src.ren_c[i]}건 (${pct(src.ren_c[i],src.ren_c[p])}% 변화)
- Pro 결제: ${src.pro_c[i]}건 / ${fmt(src.pro_r[i])} (${pct(src.pro_c[i],src.pro_c[p])}% 변화)
- Brand 결제: ${src.biz_c[i]}건 / ${fmt(src.biz_r[i])} (${pct(src.biz_c[i],src.biz_c[p])}% 변화)
- 월결제: ${src.mon_c[i]}건 / ${fmt(src.mon_r[i])} (${pct(src.mon_c[i],src.mon_c[p])}% 변화)
- 연결제: ${src.yr_c[i]}건 / ${fmt(src.yr_r[i])} (${pct(src.yr_c[i],src.yr_c[p])}% 변화)
- 취소: ${src.cancel_c[i]}건 / ${fmt(src.cancel_r[i])} (${pct(src.cancel_c[i],src.cancel_c[p])}% 변화)
- 전환율: ${src.signup[i]>0?(src.total[i]/src.signup[i]*100).toFixed(2):'0'}%

요약 작성 규칙:
1. 가장 눈에 띄는 변화 1~2개를 첫 문장에
2. 그 원인이나 기여 요인을 두 번째 문장에
3. 주의할 점이나 긍정적 시그널을 마지막 문장에
4. 숫자는 구체적으로 언급 (예: 전주 대비 12.3% 증가)
5. 한국어로, 비즈니스 톤으로`;

  try {
    const res = await fetch(`${API}?sheet=summary&prompt=${encodeURIComponent(prompt)}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    textEl.innerHTML = data.text.split('\n').filter(s=>s.trim()).map(s=>`<p style="margin-bottom:6px">${s}</p>`).join('');
  } catch(e) {
    textEl.innerHTML = '<span style="color:var(--red)">요약 생성 실패. 잠시 후 다시 시도해주세요.</span>';
  }
  if(btnEl) btnEl.disabled = false;
}

loadData();
</script>
